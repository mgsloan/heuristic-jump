[section."loops.md#7-progress-stall-and-the-ways-it-is-faked"]
state = "gaps"
last_audited = "2026-08-04T04:23:19+00:00"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".gap]]
  claim = "progress is any of five forms, one being a decision item being resolved, and all five are computable from the repository"
  found = "the computed terms are sections-clean rising, a named gap closing, tests rising when no audit ran, and a consolidation credit; resolving a decision scores nothing, so reconciling a DECISION- tag pushes the loop toward its stall threshold"
  where = "harness/hj:2617"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".gap]]
  claim = "flag when >=30% of recent iterations are test-only changes, and cap consecutive done signals"
  found = "neither exists; cmd_stall reports only trailing-no-progress, empty campaigns and crashes, though the per-campaign rust_test/rust_source diffstat needed for the first is already recorded"
  where = "harness/hj:3360"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".gap]]
  claim = "test deletions are flagged for review regardless of count"
  found = "nothing flags them; rust_test_deleted is written to the session row and read by nothing, and the gate has no test-count step. A rust_test_deleted > 0 flag at campaign-close would make this mechanical"
  where = "harness/hj:2263"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".minor]]
  claim = "progress is any of these five forms"
  note = "earned_consolidation_credit adds a sixth term (net non-test lines removed with the oracle unchanged) that the section's list does not contain \u2014 a metric redefinition made inside the loop's own tooling"
  where = "harness/hj:2527"

