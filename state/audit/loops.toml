[section."loops.md#7-progress-stall-and-the-ways-it-is-faked"]
state = "gaps"
last_audited = "2026-08-04T00:48:03+00:00"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".gap]]
  claim = "progress is any of five forms, including a decision item being resolved"
  found = "campaign-close computes three: sections clean up, open gaps down, tests up. A campaign that resolves a decision and nothing else closes as no-progress and counts toward the stall"
  where = "harness/hj:2529"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".gap]]
  claim = "test count is a ratchet; test deletions are flagged for review regardless of count"
  found = "the gate has no test-count step; test_count() is recorded in the metrics row and never compared to the previous row, and no deletion flag exists"
  where = "harness/gate:112, harness/hj:1215"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".gap]]
  claim = "the gate checks metric direction itself"
  found = "no step of harness/gate reads any metric value; check-metrics only asserts that a row exists for the last loop commit"
  where = "harness/hj:1611"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".gap]]
  claim = "harness/ is owned by nobody and denied to every loop; changes to it are Class B"
  found = "HARNESS_PATHS is dropped wholesale for a writes_harness loop, granting harness/gate, harness/prompts/auditor.md and harness/section-baseline.toml, and merge_back fast-forwards main after every green campaign so the reviewed gate becomes the loop's own output with no Class B record. Mechanizable: keep gate/prompts/auditor/baseline in DENIED_ALWAYS regardless of writes_harness"
  where = "harness/hj:97, harness/loop:165"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".gap]]
  claim = "any campaign whose commits include both a design/ edit and code under the same anchor is flagged"
  found = "spec_drift treats only crates/ and vendor/ as code, so campaign 11b9c019 \u2014 which edited design/loops.md \u00a74 and harness/hj in one run and predicted it would be flagged \u2014 recorded spec_drift null. Mechanizable: code = any owned path that is not design/"
  where = "harness/hj:2381, state/sessions.jsonl:87"

  [[section."loops.md#7-progress-stall-and-the-ways-it-is-faked".minor]]
  claim = "two further heuristics worth taking: flag \u226530% test-only iterations, and cap consecutive done signals"
  note = "neither exists; 'three empty experiments end the campaign early' is prompt text rather than a mechanism, which is defensible since only the session can end itself"
  where = "harness/prompts/conformance.md:125"

