  claim = "harness/ has one bounded exception ... never the gate, the prompts, or the auditor that judge it now"
  found = "DENIED_ALWAYS names only harness/gate, harness/prompts/auditor.md, harness/section-baseline.toml and harness/ratchets.toml; HARNESS_PATHS grants the rest of harness/** whole. So the harness loop may write harness/prompts/conformance.md \u2014 the template its own prompt and the core loop's are rendered from \u2014 and harness/hj, where every gate check is implemented. Raised as harness-009, still open with 'flag and log' in force. Mechanical fix: denied_paths adds harness/prompts/{config.prompt} and its fragments for a writes_harness loop."
  where = "harness/hj:95"
  found_at = "ff5413873eb0d1e73acadb3902191591102caf3b"

