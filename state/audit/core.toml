[section."core.md#snapshots-are-o1-to-take-and-are-parsed-before-a-handler-sees-one"]
state = "gaps"
last_audited = "2026-08-03T05:34:51+00:00"

  [[section."core.md#snapshots-are-o1-to-take-and-are-parsed-before-a-handler-sees-one".gap]]
  claim = "the two-step split keeps core doing O(1) work while the parse still happens inside the worker and inside the deadline; realise is called by the worker, never by core"
  found = "SnapshotSeed::realise takes no Deadline and cannot observe one, and passes None where tree-sitter's ParseOptions progress callback would go (document.rs:133, whose comment says 'Nothing measures that yet'), so a long parse cannot be bounded or cancelled without changing the signature. There is also no caller anywhere: grep for `realise` across the workspace finds only the definition and doc prose, and driver::dispatch never builds or realises a seed, so no worker pays the parse at all"
  where = "crates/shared/src/document.rs:100"

  [[section."core.md#snapshots-are-o1-to-take-and-are-parsed-before-a-handler-sees-one".minor]]
  claim = "DocumentSnapshot contains no synchronisation primitive, and &Query \u2014 therefore &DocumentSnapshot \u2014 crosses threads and must be Sync"
  note = "the property holds but nothing checks it: no Sync bound or assertion on DocumentSnapshot or Query exists, and there is no fan-out caller that would fail to compile. `fn _assert_sync<T: Sync>() {}` instantiated for both would make the section's load-bearing claim a compile error the day a field with interior mutability is added"
  where = "crates/shared/src/document.rs:44"

[section."core.md#text-and-tree-can-never-disagree"]
state = "gaps"
last_audited = "2026-08-03T05:34:51+00:00"

  [[section."core.md#text-and-tree-can-never-disagree".gap]]
  claim = "getting the result back to core is explicit: the dispatch wrapper \u2014 not the handler \u2014 sends `Parsed { uri, version, tree }` to core after realise succeeds, and core caches it so the next query starts warm"
  found = "no Parsed type exists anywhere; driver is `mod dispatch;` alone (driver.rs:10) with no channel to core and no tree cache, and dispatch() receives an already-built Query and calls handler.goto_definition \u2014 it never realises a seed, so there is no point at which a realised tree could be handed back and nothing ever fills SnapshotSeed::incremental's `base`. MECHANICAL CHECK AVAILABLE: make the driver's tree-cache write reachable only by consuming a `Parsed` value that only the dispatch wrapper can mint, so 'the handler cannot forget' is a type property rather than a rule"
  where = "crates/driver/src/dispatch.rs:131"

  [[section."core.md#text-and-tree-can-never-disagree".minor]]
  claim = "realise applies the edits to a private clone of the base tree via Tree::edit"
  note = "the comment asserts 'A private clone \u2026 not ours to mutate in place', but no clone() appears \u2014 realise(self) moves the seed's own Tree out of base and edits it. The property still holds because each Tree handle owns its own TSTree, but it holds by virtue of the (not yet existing) caller passing a clone, not by anything realise does"
  where = "crates/shared/src/document.rs:110"

