  [[section."core.md#7-observability-and-the-corpus-scan".gap]]
  claim = "the driver owns the measurement and each query emits one JSONL record once both answers are known"
  found = "QueryRecord is constructed and written only by measure_core's replay; nothing in crates/driver emits one. driver::run has no transport, so queued_us \u2014 the field marked driver-only \u2014 has no producer, and proxy-mode rows are written by replay rather than by the shim. Agreement/Severity classification is implemented driver-side, so the missing half is the emission"
  where = "crates/driver/src/driver.rs:37"
  found_at = "3dba8fae70beafb43851557f5d67a54115d53791"

  [[section."core.md#7-observability-and-the-corpus-scan".minor]]
  claim = "truncated_list says the ranked list hit the cap; in standalone five fields are null"
  note = "replay writes truncated_list as a literal false and server_health as None while declaring mode = Proxy, which is a third case the section does not describe; truncated_list has no producer anywhere since the cap is the driver's"
  where = "crates/measure_core/src/replay.rs:251"

