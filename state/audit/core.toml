  [[section."core.md#81-why-not-lsp-types".minor]]
  claim = "the newtypes are what deserialization produces rather than what a conversion layer produces afterwards \u2014 DocumentUri, DocumentVersion, EditorRequestId, LanguageId, Offset"
  note = "three of the five are genuine deserialization targets and Offset is reachable only through WirePosition::resolve, but language_id deserializes as Box<str> and is laundered by Registry::language_id afterwards. The layer is mandatory rather than optional, which is the section's real objection, and the code states the exception \u2014 but it is a conversion layer in one of the named types"
  where = "crates/shared/src/proto.rs:519"

