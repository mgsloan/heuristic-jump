[section."core.md#two-modes-collect-and-replay"]
state = "gaps"
last_audited = "2026-08-03T20:56:22+00:00"

  [[section."core.md#two-modes-collect-and-replay".gap]]
  claim = "truth.jsonl carries its provenance in a header record: repository path and commit, server name and version, grammar revision, and the measure version"
  found = "the grammar field is a constant literal naming no revision, so two collections under different grammar pins produce identical headers. Mechanically checkable: derive it from the locked grammar version and assert two pins differ"
  where = "crates/measure_core/src/collect.rs:310"
  found_at = "00d347edfccbe8d2c7b83558c8d720e5222ca6e8"

  [[section."core.md#two-modes-collect-and-replay".gap]]
  claim = "replay refuses to run against a truth file whose repository commit does not match the checkout, rather than silently reporting metrics for positions that have since moved"
  found = "collect's resume path writes the current HEAD into the header while re-appending rows collected at the old commit; check_resumable compares only server_version, so a mixed-commit file passes replay's check. A commit comparison in check_resumable would close it"
  where = "crates/measure_core/src/collect.rs:44"
  found_at = "00d347edfccbe8d2c7b83558c8d720e5222ca6e8"

  [[section."core.md#two-modes-collect-and-replay".minor]]
  claim = "collect writes rows with the lsp_* fields populated and the heuristic side null"
  note = "collect writes a separate five-field truth row (file, offset, outcome, answer, latency_us); the \u00a77 record is only ever assembled in replay"
  where = "crates/measure_core/src/truth.rs:71"

