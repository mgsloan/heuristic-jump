  [[section."core.md#vocabulary-types".minor]]
  claim = "LanguageId: only ids some registered handler declared exist, so an unknown language cannot be constructed at all"
  note = "`new` is a public const fn over &'static str, so LanguageId::new(\"klingon\") compiles anywhere and String::leak produces a &'static str at runtime \u2014 the vocabulary test uses exactly that. The operative property (nothing off a wire becomes a LanguageId) holds, and the doc comment is candid that visibility is not the mechanism"
  where = "crates/shared/src/vocabulary.rs:58"

[section."core.md#the-trait"]
state = "gaps"
last_audited = "2026-08-04T05:37:37+00:00"

  [[section."core.md#the-trait".gap]]
  claim = "Stratum::Unimplemented is the unmodified template's; no real handler may return it, and its presence in a metrics table means the template has not been replaced"
  found = "the driver synthesises it: a hard-capped late answer is recorded as Abstain{Deadline} under Strata::from_reference(Stratum::Unimplemented), so a real handler that misses its deadline writes an `unimplemented` abstention into \u00a77's record \u2014 the exact counter Table::template reads as \"unreplaced\" (measure_core/src/table.rs:158). Marked DECISION-core-017 provisional in the code. Mechanisable: assert a recorded row never carries stratum_prior \"unimplemented\" when the handler reported a stratum"
  where = "crates/driver/src/actor.rs:582"
  found_at = "dd846068c786ddbbfe01f8970d7bd0914b1c1742"

  [[section."core.md#the-trait".minor]]
  claim = "handlers run the literal scan on the bounded pool from shim.md \u00a710 rather than on threads a handler spawned"
  note = "ProjectView::new takes (files, deadline, grammar) and scan runs sequentially on the calling thread; deliberate and documented, but the pool the section says is handed at construction does not exist"
  where = "crates/shared/src/project.rs:426"

