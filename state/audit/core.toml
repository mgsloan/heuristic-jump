  [[section."core.md#4-project-file-enumeration".gap]]
  claim = "the editor's watcher is opportunistic and nothing depends on it; the on-demand NoCandidates rescan is the backstop that always works, and a stale entry for a removed file only ever surfaces as a failed read"
  found = "a removed candidate fails the whole scan (project.rs:586 propagates ProjectError::Read), dispatch classifies Error::Project as Dispatched::Failed (dispatch.rs:557), and FileListCache::observe ignores Failed as 'evidence about the handler' (files.rs:179) \u2014 so the list is never marked stale, no rescan is scheduled, and every later query over that candidate set fails the same way until a watcher event only proxy mode can produce. A fixture test that deletes a file after FileList::enumerate and asserts an abstention or a stale mark rather than a permanent Err would make this claim mechanical; driver/tests/file_list.rs has no read-failure case."
  where = "crates/driver/src/files.rs:179"
  found_at = "41ebe25a3140dc47bbdaeb9f71bef44f98402948"

