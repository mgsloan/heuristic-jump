  [[section."core.md#what-the-templates-handler-does".gap]]
  claim = "Stratum::Unimplemented is self-identifying: its presence in a metrics table means the template has not been replaced, as a gate check"
  found = "a handler that returns Err is counted under Unimplemented in replay, and the table renders the row unconditionally, so presence is not evidence the template is in place. A gate needs `unimplemented.queries > 0 && failed == 0`, or failures need their own stratum"
  where = "crates/measure_core/src/replay.rs:205"
  found_at = "00d347edfccbe8d2c7b83558c8d720e5222ca6e8"

  [[section."core.md#what-the-templates-handler-does".minor]]
  claim = "the identifier rule is one function in shared, not two implementations that agree"
  note = "the predicate is shared but the lookups differ \u2014 a tree walk for enumeration, named_descendant_for_byte_range for the handler \u2014 and nothing asserts they select the same positions"
  where = "crates/shared/src/identifier.rs:31"

