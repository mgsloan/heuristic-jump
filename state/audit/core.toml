  [[section."core.md#82-what-replaces-it-and-why-it-is-smaller-than-it-sounds".minor]]
  claim = "each constructed type is separate from its read twin, carrying Serialize and not Deserialize, so the two lists stay disjoint"
  note = "the code adds a third category, BOTH \u2014 PositionEncoding, TextDocumentSyncKind, WireLocation, WirePosition, WireRange \u2014 each deriving both. Defensible, since these are total value types that lose nothing on a round trip and \u00a78.3 requires WirePosition::encode, but the third list is the code's invention asserted by a test as though the section had named it"
  where = "crates/shared/tests/proto.rs:125"

