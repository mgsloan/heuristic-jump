  [[section."core.md#84-location-is-byte-based-and-this-fixes-a-real-inconsistency".gap]]
  claim = "the Location -> WireLocation conversion happens in the worker, not in `core`, because it reads the target file and `core` never touches the filesystem"
  found = "there is no worker pool: Actor::requested calls dispatch in line, so encode's per-location re-read runs on the core thread. dispatch.rs:334 asserts the opposite. Mechanisable: assert the thread calling dispatch is not the one running Actor::run"
  where = "crates/driver/src/actor.rs:499"
  found_at = "4266031455e91fde2c3f8d08f91909260ab9a81f"

