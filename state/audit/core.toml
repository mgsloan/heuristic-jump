[section."core.md#the-trait"]
state = "gaps"
last_audited = "2026-08-05T01:40:56+00:00"

  [[section."core.md#the-trait".gap]]
  claim = "handlers read, parse and search through ProjectView so the driver can cache reads within a query, reuse the parse LRU, and run the literal scan on the bounded pool"
  found = "ProjectView has no read cache, `parse` builds a fresh Parser per call and documents that there is no LRU to reach, and `scan` is a sequential loop with no pool \u2014 all correct per conformance-005/012 and CLAUDE.md, so the fix is the tense fix \u00a79 already took in CHANGE-core-029. A check that ProjectView holds no cache or pool field would hold it mechanically"
  where = "crates/shared/src/project.rs:591"
  found_at = "975523384418d70ab58801dd65e363bfcd28000d"

  [[section."core.md#the-trait".minor]]
  claim = "ProjectPath has a private field and constructor: only ProjectView mints one"
  note = "the type's own doc says only `FileList` mints one, and both do \u2014 `ProjectView::lookup` builds a probe through the same private `new`"
  where = "crates/shared/src/project.rs:77"

