  [[section."core.md#the-trait".minor]]
  claim = "`Outcome::Committed { locations, confidence, stratum }` and `decide(&self, stratum, confidence, locations)`"
  note = "the code carries `strata: Strata` and `trace: Trace` on both arms and a four-argument decide, per the accepted ruling on conformance-013; the section still prints the superseded shape and no spec-changelog entry aligns it"
  where = "crates/shared/src/handler.rs:82"

  [[section."core.md#the-trait".minor]]
  claim = "handlers never construct `Outcome::Committed`; every path ends through `policy.decide(..)`"
  note = "the variant and its fields are public, so a handler could build one directly \u2014 a driver test already does; the claim holds only because the sole handler abstains. A source scan over crates/lang_* would make it structural"
  where = "crates/driver/tests/file_list.rs:208"

  [[section."core.md#the-trait".minor]]
  claim = "handlers work through `ProjectView` so the driver can cache reads within a query, reuse the parse LRU, and run the literal scan on the bounded pool"
  note = "none of the three exist \u2014 read goes to the filesystem every time, parse builds a fresh Parser, scan is sequential; deliberate under conformance-005 and CLAUDE.md, but the bullet still promises all three"
  where = "crates/shared/src/project.rs:500"

