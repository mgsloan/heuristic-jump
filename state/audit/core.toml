  [[section."core.md#83-the-wire-position-type-is-inert".gap]]
  claim = "WirePosition has private fields and no accessors"
  found = "`pub fn line(self) -> LineIndex` is a public accessor, and it is load-bearing: agreement.rs:239 reads the child's row through it because \u00a76's predicate must compare (uri, line) without reading the child's document. The inertness that matters \u2014 no Offset without the encoding and the text \u2014 is intact, so the two sections cannot both stand as written"
  where = "crates/shared/src/proto.rs:106"
  found_at = "e23d2149549728b19f61bbdd3fb2490dcb8256d2"

