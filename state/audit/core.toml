state = "gaps"
last_audited = "2026-08-03T03:47:22+00:00"

  [[section."core.md#3-position-encoding".gap]]
  claim = "conversion lives in one module with exhaustive property tests against a reference implementation"
  found = "no conversion module and no property test exist; the only test file is crates/heuristic_jump/tests/binary_name.rs, no crate depends on proptest, and vendor/ (whose rope OffsetUtf16/PointUtf16 dimensions the section names as the mechanism) does not exist on disk"
  where = "crates/shared/src/shared.rs:1"

  [[section."core.md#3-position-encoding".gap]]
  claim = "a settled PositionEncoding set once and never inferred, with the no-UTF-16-past-the-edge rule enforced by the type system: proto::WirePosition has private fields and yields a ByteOffset only when handed the negotiated encoding and the text"
  found = "no proto module, no WirePosition, no PositionEncoding type anywhere in crates/. The only enforcement present is the cast_* deny block at Cargo.toml:77-82, which the manifest itself (Cargo.toml:74-76) describes as catching computation rather than storage"
  where = "crates/shared/src/shared.rs:1"

  [[section."core.md#3-position-encoding".minor]]
  claim = "the no-UTF-16 rule is enforced by the type system rather than by discipline"
  note = "the lint config justifies not denying indexing_slicing/string_slice with 'the protection that holds here is structural: WirePosition has private fields, offsets are newtypes' \u2014 present tense about types that do not exist, which reads as evidence the enforcement is already in place"
  where = "Cargo.toml:87"

