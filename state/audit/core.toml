  [[section."core.md#snapshots-are-o1-to-take-and-are-parsed-before-a-handler-sees-one".gap]]
  claim = "the split keeps `core` doing O(1) work while the parse happens inside the worker; realise is called by the worker, never by `core`"
  found = "dispatch calls SnapshotSeed::realise, and the only caller of dispatch is the single-threaded actor, so the parse and the whole query are paid on core's thread"
  where = "crates/driver/src/dispatch.rs:351"
  found_at = "4266031455e91fde2c3f8d08f91909260ab9a81f"

[section."core.md#text-and-tree-can-never-disagree"]
state = "gaps"
last_audited = "2026-08-04T23:43:10+00:00"

  [[section."core.md#text-and-tree-can-never-disagree".gap]]
  claim = "the parse is paid inside the worker and inside the deadline, never in `core`; `core` builds seeds and never realises one"
  found = "Actor::requested realises the seed on the core thread by calling dispatch synchronously; core is not free of parsing"
  where = "crates/driver/src/actor.rs:499"
  found_at = "4266031455e91fde2c3f8d08f91909260ab9a81f"

  [[section."core.md#text-and-tree-can-never-disagree".minor]]
  claim = "the dispatch wrapper sends Parsed to `core`; the handler is not involved and cannot forget"
  note = "the wrapper returns Completed { parsed: Option<Parsed> }, a public field a caller may drop; the actor happens to insert it, so the property is discipline at one call site rather than a type"
  where = "crates/driver/src/dispatch.rs:409"

