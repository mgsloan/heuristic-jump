  [[section."core.md#86-modelling-errors-must-fail-closed".gap]]
  claim = "didSave is a free end-to-end checksum: the rope's length or hash must match the file, the read belongs in a worker off the critical path, and a mismatch marks the document untrusted"
  found = "only the half where the notification carries `text` is performed; `Documents::saved` returns `Saved::NeedsRead` otherwise and the actor logs it and returns, doing no read and no comparison, and `Documents::checked` has no caller in src/. A scan asserting `Documents::checked` is reached from driver/src/ would make this mechanical"
  where = "crates/driver/src/actor.rs:477"
  found_at = "fe25ac72eba0104d52a3b4100fdfb6fe59e7e9a9"

