  found = "QueryRecord is constructed and written only by measure_core's replay; nothing in crates/driver emits one. driver::run has no transport, so queued_us \u2014 the field marked driver-only \u2014 has no producer, and proxy-mode rows are written by replay rather than by the shim. Agreement/Severity classification is implemented driver-side, so the missing half is the emission"
