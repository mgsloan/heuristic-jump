  [[section."core.md#vocabulary-types".gap]]
  claim = "ByteColumn, Utf16Column and CharCount are defined in the vendored rope and re-exported by shared, like ByteOffset/ByteLen/ByteRange/LineIndex, so every other crate says shared::\u2026 and never has to know"
  found = "rope defines and exports all seven (vendor/rope/src/rope.rs:36-40) but shared re-exports four plus Rope, so shared::ByteColumn, shared::Utf16Column and shared::CharCount are not nameable by a crate that may not depend on rope \u2014 which is the reason the section gives for the re-export. MECHANICAL CHECK AVAILABLE: one `use shared::{\u2026}` naming all seven in an existing test makes the re-export list a compile error rather than a reading"
  where = "crates/shared/src/shared.rs:32"

  [[section."core.md#vocabulary-types".minor]]
  claim = "only ids some registered handler declared exist, so an unknown language cannot be constructed at all"
  note = "LanguageId::new is a public const fn over any &'static str, and the type's doc says the registry 'produces an Option<LanguageId>' while Registry::for_language_id returns Option<&dyn LanguageHandler> (dispatch.rs:91) and nothing ever produces a LanguageId from a wire string. The impossibility holds for wire input by the &'static bound, not by the registry the doc names"
  where = "crates/shared/src/vocabulary.rs:45"

