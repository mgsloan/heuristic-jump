[section."core.md#two-modes-collect-and-replay"]
state = "gaps"
last_audited = "2026-08-04T05:37:37+00:00"

  [[section."core.md#two-modes-collect-and-replay".gap]]
  claim = "collect's output is a frozen artifact and a truth file is regenerated, never edited \u2014 a partially refreshed corpus is the worst case, because it looks like a regression"
  found = "the checkpoint appends only the single latest row every CHECKPOINT_EVERY positions, so a crashed run leaves a sparse file that is not a prefix; the resume then uses that row count as a position index (done = existing.rows.len()), skipping the first `done` enumerated positions and duplicating the checkpoint rows. The finished file is marked complete:true and replay consumes it"
  where = "crates/measure_core/src/collect.rs:113"
  found_at = "dd846068c786ddbbfe01f8970d7bd0914b1c1742"

  [[section."core.md#two-modes-collect-and-replay".minor]]
  claim = "the record in this section is the join: collect writes rows with the lsp_* fields populated and the heuristic side null"
  note = "collect writes a separate compact schema (truth::Row) and replay builds \u00a77's record from it; the byte-comparability property holds and is tested, but the stated mechanism is not the one implemented"
  where = "crates/measure_core/src/truth.rs:160"

