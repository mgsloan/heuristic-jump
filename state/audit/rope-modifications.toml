  [[section."rope-modifications.md#textsummary-is-converted-too".gap]]
  claim = "TextSummary is converted to the newtypes, and a conversion edit changes representation and never arithmetic"
  found = "TextSummary::add_newline computes `self.len_utf16 += OffsetUtf16(self.len_utf16.0 + 1)`, which is 2*len_utf16 + 1 rather than len_utf16 + 1 \u2014 the sibling line one above is the correct shape. The method has no caller or test in the vendored copy, so upstream's kept tests cannot catch it; a round-trip over newline()/add_newline() in tests/newtype_api.rs would"
  where = "vendor/rope/src/rope.rs:1405"

