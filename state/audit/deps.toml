  [[section."deps.md#10-errors-one-enumerated-type-no-anyhow".gap]]
  claim = "every variant carries typed context, not a formatted string; foreign errors are wrapped as `#[source]` fields so the classification is ours and only the detail is theirs"
  found = "ConfigError::ManifestMalformed carries the toml::de::Error's rendered message as `reason: Box<str>` instead of a #[source] field \u2014 the one place in the enum where a foreign error's detail is flattened to prose. Deliberate (the doc comment cites shared's dependency graph), so a human should rule."
  where = "crates/shared/src/error.rs:77"

  [[section."deps.md#10-errors-one-enumerated-type-no-anyhow".minor]]
  claim = "an Error converted into an abstention is converted explicitly and logged"
  note = "documents.rs:381 logs before marking untrusted; dispatch::classify converts HandlerError::DeadlineExpired into an abstention silently"
  where = "crates/driver/src/dispatch.rs:405"

