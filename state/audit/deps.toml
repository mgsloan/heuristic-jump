  claim = "with the unbounded lint withdrawn, the only mechanism left is to log the core inbox depth and watch it, since memory is bounded only by shim.md \u00a710's shed-load rule"
  found = "nothing reads Receiver::len(): the actor's select!/recv_timeout loop logs no queue depth, and the only length logged is pending/traced at channel close. crossbeam's len() \u2014 \u00a71's stated reason for choosing it over std::sync::mpsc \u2014 has no caller in the workspace. Mechanisable: drive the actor with N queued events and assert a depth field on the log line, as pipeline.rs does for replay's wall clock"
  where = "crates/driver/src/actor.rs:203"
  found_at = "dd846068c786ddbbfe01f8970d7bd0914b1c1742"

