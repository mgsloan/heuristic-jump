[section."deps.md#1-async-runtime-none"]
state = "gaps"
last_audited = "2026-08-05T02:26:51+00:00"

  [[section."deps.md#1-async-runtime-none".gap]]
  claim = "the one remaining timer (the file-list rescan debounce) is crossbeam::select! with after(dur) inside the core loop"
  found = "both select! branches use a default(self.debounce.window()) arm, which fires only when no other operation is ready \u2014 so a sustained event stream starves tick(), and refresh_if_due (the only caller of Scanner::request) never sends the rescan. Mechanizable: an actor test that keeps the inbox non-empty past the debounce window and asserts a rescan is still requested"
  where = "crates/driver/src/actor.rs:376"
  found_at = "0e5f2f7a502b86df13267a1307b61a773c40211d"

  [[section."deps.md#1-async-runtime-none".minor]]
  claim = "the worker pool is CPU-bound work, which is what rayon is for"
  note = "the dispatch pool is a hand-rolled std::thread::Builder pool over two crossbeam channels; rayon is undeclared in driver and core.md \u00a79 earmarks it for the per-query fan-out instead"
  where = "crates/driver/src/workers.rs:363"

