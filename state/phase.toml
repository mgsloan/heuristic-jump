# Desired state. `design/loops.md` section 14.
#
# A human advances the phase; the harness only reads this. It has to be a
# file rather than harness memory, or a restart loses which phase the project
# is in.
#
# Denied to every loop by `harness/hj`'s DENIED_ALWAYS, which is a constant in
# the code rather than a row here: a loop that could edit the ownership table
# could widen its own reach, and the table is exactly what stops it.

phase = "1a"

# How many campaigns close between audits. The auditor is a whole session per
# run (`design/loops.md` section 15 calls it a fixed cost), and running it
# after every campaign spends that on a picture that has barely moved. A
# campaign that closes with no audit since it opened is excluded from the
# stall count unless it made progress — otherwise the cadence itself would
# stop the loop.
# Lowered from 3. The audit is the only oracle, and at 3 it was firing
# rarely enough that a section's verdict was often several campaigns stale
# by the time anything read it — and `audit_due` was additionally skipping
# campaigns recorded `crashed`, four of which had committed real work, so
# the effective cadence was slower than the number said.
audit_every = 2

# Phase 1a is one writer, and it runs as a conformance loop. The one carve-out
# is the seam — `LanguageHandler`, `Query`, `Outcome`, `ProjectView`, the
# vocabulary newtypes — which is decided and frozen here and is a Class B
# escalation *even during 1a*, when `crates/shared/` is otherwise the loop's
# own. Getting it wrong is expensive downstream in a way no loop will notice:
# a language loop cannot observe that the seam made its job harder, only that
# it is slow (`design/loops.md` section 8).
[loop.core]
status = "paused" # running | paused | blocked | done
prompt = "conformance.md"
stall_n = 3        # campaigns without progress before the loop stops and asks
# Sections per audit beyond the ones the last campaign touched. It is an
# absolute count, so it does not scale with the document set: at 6 it swept
# 34 sections in ~18 campaigns, and adding `rope-modifications.md` stretched
# the same setting to ~27. That interval is how long a section waits to be
# looked at a *second* time, which is the only thing that catches one wrongly
# called clean — the failure `harness/prompts/auditor.md` calls the worst
# available to it, and the reason `persisted` had been 0 on every run.
#
# 18 sweeps 53 sections in 3 audits, so ~9 campaigns. Cost per sweep is
# roughly flat — three larger audits instead of nine small ones — and the
# splice grows to about 12k tokens of section text, which is small against
# the 45-59 turns an audit already runs. What is being spent is attention
# per section rather than money, so an auditor that starts rubber-stamping
# is the thing to watch: `HJ_AUDIT_MODEL` is the lever if it does.
rotation = 18
splice_sections = 3

# How many gaps carry full claim/found/where in the prompt. The rest are one
# line each. Every turn re-reads the whole prompt, and the observed cache-read
# to output ratio is about 141:1, so the tail's size — not the campaign count —
# is what a campaign costs.
detail_gaps = 8

# Turns a campaign should aim for. Campaigns were closing at about seventy with
# two commits, which throws away context that a fresh session has to re-derive
# from nothing — so work moves from the cheap side to the expensive side every
# time one closes early. A single figure rather than a range, because a range
# is read from its bottom: campaigns given "100 to 200" closed near 100 and
# treated the floor as the goal. It is still not a ceiling to reach for — the
# last turns of a very long campaign are its most expensive and least informed.
turn_target = "about 150"

# The documents the audit covers. `core.md` and `shim.md` make checkable
# claims; `resolution.md` describes an approach whose success is *measured*,
# so conforming to it would be optimising the wrong thing
# (`design/loops.md` section 3). `shim.md` joins this list at phase 2b, and
# `loops.md` when the loop turns around and builds the phase-2 machinery.
docs = ["core.md", "rope-modifications.md", "deps.md"]

# Cargo packages, matched as globs against the workspace members that
# actually exist. A row for a crate not yet created costs nothing.
#
# `rope` and `sum_tree` are here so the gate *tests* them — their 29 upstream
# tests are the only independent check that the newtype sweep did not change
# rope's behaviour, and the campaign that performs that sweep is the one that
# will believe a green gate (`conformance-003`). They are not linted or
# format-checked: `hj crates --lintable` drops members whose manifest sits
# under `vendor/`, because `deps.md` §14 withholds the workspace lints from
# `vendor/*` deliberately and both `clippy -D warnings` and `fmt --check` fail
# on unedited upstream text.
crates = [
  "shared",
  "driver",
  "heuristic_jump",
  "measure_core",
  "measure_rust",
  "lang_rust",
  "rope",
  "sum_tree",
  # Ported and frozen, and denied to every loop outside a whole-repository
  # phase — but built and tested here, because a crate nothing gates is a
  # crate that rots. Its lints are ours, unlike `vendor/*`.
  "similarity",
]

# `crates/lang_rust/` is named here and not globbed, deliberately. Phase 1a's
# scope includes instantiating the language-crate template once
# (`design/phases.md`), but decided question 10 says the loop may never *add*
# a language — so `crates/lang_python/` stays outside every owned path and the
# gate rejects it. Naming one path grants the template without granting the
# glob.
#
# `measure_core` and `measure_rust` belong here rather than to a language
# loop: a loop must not own the code that scores it.
# `rust-toolchain.toml` and `LICENSE-MIT`/`LICENSE-GPL`/`LICENSE-APACHE` are
# deliberately absent from this list, and a human has placed all four
# (`conformance-002`). The toolchain pin can move every latency number and
# every binary size with no diff in this repository explaining it, so it is an
# intervention rather than a commit; the licence texts are verbatim upstream
# documents and licensing is a standing Class B trigger. The per-crate
# symlinks that point at them live under `crates/**` and are the loop's to
# create, which is what unblocks the vendoring campaign.
write = [
  "Cargo.toml",
  "Cargo.lock",
  "rustfmt.toml",
  ".gitignore",
  "readme.md",
  "vendor/**",
  "crates/shared/**",
  "crates/driver/**",
  "crates/heuristic_jump/**",
  "crates/measure_core/**",
  "crates/measure_rust/**",
  "crates/lang_rust/**",
  "design/**",
  "state/campaigns/core/**",
  "state/journal/core.md",
  # Both prefixes: new records are `core-NNN`, and the sixteen the loop
  # issued while it was called `conformance` keep their ids, so it must
  # still be able to reconcile one.
  "state/decisions/core-*.md",
  "state/decisions/conformance-*.md",
  "state/metrics/core.jsonl",
  "state/findings/core.md",
  # Both, for now. The per-loop file is where new entries go; the flat one
  # stays writable because a campaign whose prompt was rendered before the
  # split would otherwise fail the gate on a path it was told to use, and
  # because its oldest entry is `CHANGE-bootstrap`, which is nobody's loop.
  "state/spec-changelog/core.md",
  "state/spec-changelog.md",
  "state/handoff.md",
]

# A permission prompt in `claude -p` is a denial, and a campaign cannot run
# `harness/gate`, `cargo` or `git commit` under one — so this defaults to
# `bypassPermissions` and the containment is the design's rather than the
# CLI's: the PreToolUse hook for fast feedback, the gate's diff-scope check
# for enforcement (`design/loops.md` section 13).
#
# Set it to `acceptEdits` to watch a run and approve each command yourself.
# That is the right setting for the first campaign or two and the wrong one
# for an overnight run, since an unanswered prompt reads as a refused tool.
permission_mode = "bypassPermissions"

# Optional. `budget_usd` closes a campaign that runs long, which also bounds
# context growth since context now accumulates within a campaign
# (`design/loops.md` section 15). `model` overrides the tier per loop.
# budget_usd = 15.0
# model = "opus"

# Phase 2a adds one row per *language* — not per (language, server), which an
# earlier revision had: a language with two usable servers has two metric
# tables and one optimiser that reads both, because a per-server loop owns a
# single profile file it may not grow except on corpus evidence and may not
# branch on server identity at all, which leaves it almost no legal move
# (`design/loops.md` section 10, "Several servers do not mean several loops").
#
# A row is the whole of adding a language to the loop set — the same property
# the workspace layout already has for adding a language crate. None are
# written yet because there is nothing to tune until there is a corpus
# (`design/loops.md` section 18).
#
# [loop.lang-rust]
# status = "paused"
# prompt = "tuning.md"
# language = "rust"
# stall_n = 5
# crates = ["lang_rust", "measure_rust"]
# write = [
#   "crates/lang_rust/**",
#   "state/campaigns/lang-rust/**",
#   "state/journal/lang-rust.md",
#   "state/decisions/lang-rust-*.md",
#   "state/metrics/lang-rust.jsonl",
#   "state/findings/lang-rust.md",
#   "state/shared-proposals/rust-*.md",
# ]

# ---------------------------------------------------------------------------
# The harness loop: `design/loops.md` §18, "The conformance loop builds the
# followup". It audits `loops.md` and builds the phase-2 machinery.
#
# §18 puts this after phase 1a's gate — every section of `core.md` clean —
# on the argument that a loop which has not proved itself should not build the
# thing that will run six more loops. It starts earlier than that by a human's
# decision, logged as an intervention.
#
# `writes_harness` is the whole of the exception. Every other loop is denied
# `harness/**` absolutely; this one is not, and the invariant it would
# otherwise break — a loop must not weaken the gate that judges it — is held
# by the pinned gate instead: `harness/loop` exports the reviewed harness's
# path, `hj` renders the gate command as an absolute path into it, and the
# campaign is graded by the copy on the integration branch rather than the one
# in its worktree. Read the comment on `HARNESS_PATHS` in `harness/hj` before
# changing either half; they are only safe together.
#
# `clippy.toml` and `state/phase.toml` stay denied even here, because both are
# read from the tree being checked rather than from the harness — editing them
# *would* change how this loop is scored.
[loop.harness]
status = "paused" # running | paused | blocked | done
prompt = "conformance.md"
writes_harness = true
worktree = "../heuristic-jump-harness"
branch = "loop/harness"
stall_n = 3
rotation = 18
splice_sections = 3
detail_gaps = 8
turn_target = "about 150"
docs = ["loops.md"]

# Only what it builds and its own state. `harness/**` is granted by
# `writes_harness` rather than listed, so that the grant and its justification
# stay in one place.
crates = []
write = [
  "harness/**",
  "design/loops.md",
  "state/campaigns/harness/**",
  "state/journal/harness.md",
  "state/decisions/harness-*.md",
  "state/metrics/harness.jsonl",
  "state/findings/harness.md",
  "state/spec-changelog/harness.md",
  "state/handoff.md",
]
permission_mode = "bypassPermissions"
