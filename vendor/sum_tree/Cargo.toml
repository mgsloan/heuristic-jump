[package]
name = "sum_tree"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "A sum tree data structure, a concurrency-friendly B-tree"

# Deliberately NOT `[lints] workspace = true`: `deps.md` §14 keeps the
# workspace rules on `crates/*` only, so upstream's text stays unedited and
# the re-sync diff stays readable. Recorded in `vendor/README.md`.
[lints]

[lib]
path = "src/sum_tree.rs"
doctest = false

[dependencies]
heapless.workspace = true
rayon.workspace = true
log.workspace = true
tracing.workspace = true
proptest = { workspace = true, optional = true }

[dev-dependencies]
rand.workspace = true
proptest.workspace = true

[package.metadata.cargo-machete]
ignored = ["tracing"]

[features]
test-support = ["proptest"]
