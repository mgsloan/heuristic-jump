[package]
name = "rope"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

# Deliberately NOT `[lints] workspace = true`: `deps.md` §14 keeps the
# workspace rules on `crates/*` only, so upstream's text stays unedited and
# the re-sync diff stays readable. Recorded in `vendor/README.md`.
#
# The one entry is not a rule but a false positive: `unexpected_cfgs` fires on
# `rust_analyzer`, a cfg Zed sets from outside cargo, and Zed allows the lint
# workspace-wide (`../zed/Cargo.toml`). Their cfg, not ours to delete.
[lints.rust]
unexpected_cfgs = { level = "allow" }

# These two are not a lint policy for this crate either — they are the two
# default-level clippy lints upstream's `rope.rs` trips, and they leak out of
# here the moment a crate that *is* linted depends on rope: `cargo clippy -p
# shared --all-targets -- -D warnings` compiles rope from source, and `-D
# warnings` is a command-line flag that applies to every crate in the build,
# not just the one named by `-p`. Without this the gate turns red on a
# dependency edge, in a crate the gate is documented not to lint.
#
# Allowed rather than fixed, one reason each:
# * `should_implement_trait` fires on `Lines::next`, which *cannot* implement
#   `Iterator` — it returns `Option<&str>` borrowed from `self`, which is a
#   lending iterator and does not fit the trait.
# * `from_over_into` fires on `impl Into<Chunk> for ChunkSlice<'_>`. The fix is
#   mechanical and clippy offers it, but it is an edit to upstream's text that
#   buys nothing here.
[lints.clippy]
should_implement_trait = "allow"
from_over_into = "allow"

[lib]
path = "src/rope.rs"

[dependencies]
heapless.workspace = true
log.workspace = true
rayon.workspace = true
sum_tree.workspace = true
unicode-segmentation.workspace = true
tracing.workspace = true

[dev-dependencies]
rand.workspace = true
criterion.workspace = true

[[bench]]
name = "rope_benchmark"
harness = false

[package.metadata.cargo-machete]
ignored = ["tracing"]
