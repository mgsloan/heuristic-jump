[package]
name = "heuristic_jump"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license = "MIT"

[lints]
workspace = true

# Cargo names a binary target after the package, not after a hyphenated form
# of it, so the artifact this crate exists to produce needs the rename that
# `core.md` §9 once said it did not. CHANGE-conformance-001.
[[bin]]
name = "heuristic-jump"
path = "src/heuristic_jump.rs"

# `core.md` §9's edge list: `driver` and every `lang_*`, plus `clap` and
# `tracing-subscriber`. The language crates are here and nowhere else — this is
# the single place the list is enumerated, and `driver` depending on one is the
# rule the whole graph is built around.
#
# `shared` is the fourth thing §9's own printed `main` requires and its prose
# omits: `main` returns `Result<(), shared::Error>`, and there is no route to
# that name except the crate that defines it (CHANGE-conformance-009).
# `measure_rust` carries it for the same reason.
[dependencies]
clap.workspace = true
driver.workspace = true
lang_rust.workspace = true
shared.workspace = true
tracing-subscriber.workspace = true
