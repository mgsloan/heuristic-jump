[package]
name = "driver"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license = "MIT"

[lints]
workspace = true

[lib]
path = "src/driver.rs"
doctest = false

[dependencies]
crossbeam-channel.workspace = true
rustc-hash.workspace = true
# `deps.md` §1's table lists `serde_json` (`raw_value`) for shared and driver.
# It arrives here with `Documents`, which reads the four state-bearing
# notifications itself: `core.md` §8.6's rule starts at "any failure while
# deserializing", so a caller that deserialized first would have nowhere to
# report one.
serde_json.workspace = true
shared.workspace = true
tracing.workspace = true

# `core.md` §8.4's conversion is asserted end to end, which needs a handler that
# commits — and a `LanguageHandler` impl has to name `tree_sitter::Language`,
# while a `Query` needs a `DocumentSnapshot` that needs a grammar to parse. Both
# are dev-only and neither is an edge §9's graph forbids: `shared` and
# `measure_core` take a grammar the same way and for the same reason, and
# `tests/seam.rs` asserts the `[dependencies]`/`[dev-dependencies]` distinction
# rather than assuming it. A `lang_*` edge stays banned in every table.
[dev-dependencies]
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
