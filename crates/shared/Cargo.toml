[package]
name = "shared"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license = "MIT"

[lints]
workspace = true

[lib]
path = "src/shared.rs"
doctest = false

# `rope` is the only one of these that is a *layering* claim rather than a
# choice: the text vocabulary is defined there and re-exported here, because
# `shared` depends on `rope` and the dependency cannot run the other way
# (`rope-modifications.md` §2, `core.md` §1).
[dependencies]
ignore.workspace = true
rope.workspace = true
rustc-hash.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
url.workspace = true

# `serde_json` is a dev-dependency and not yet a dependency: nothing in
# `shared` writes a frame, and `proto`'s only inbound door is `Deserialize`,
# which is generic over the format. The property tests need *a* format to open
# that door with, and it has to be the one production uses (`core.md` §8.3:
# `WirePosition::encode` is the only other constructor, so a test cannot build
# one any other way — which is the point of the type).
[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
