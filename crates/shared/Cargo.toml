[package]
name = "shared"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license = "MIT"

[lints]
workspace = true

[lib]
path = "src/shared.rs"
doctest = false

# `rope` is the only one of these that is a *layering* claim rather than a
# choice: the text vocabulary is defined there and re-exported here, because
# `shared` depends on `rope` and the dependency cannot run the other way
# (`rope-modifications.md` §2, `core.md` §1).
[dependencies]
ignore.workspace = true
rope.workspace = true
rustc-hash.workspace = true
serde.workspace = true
# On §9's list for `shared` from the start, and it arrives here with the two
# users that need the *format* rather than the `Serialize`/`Deserialize`
# traits, which are generic over it: `proto::ProgressParams` keeps its value
# as a `RawValue` because what a progress payload means is per-server
# (`shim.md` §6), and the response envelope echoes the request id as the JSON
# text `EditorRequestId` stores, which is a `RawValue` too. Both are
# `serde_json`-specific by construction.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
