[package]
name = "measure_rust"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

# `conformance-014` (answered), which settles the rule and not just this crate:
# **a `license` field describes copyright in that crate's own text.** The
# licence of what it links is a property of the artifact and is recorded once,
# in `deps.md` §14 — "binary crate; the artifact it builds is GPL".
#
# This previously read GPL-3.0-or-later, reasoning "GPL through `lang_rust`".
# `heuristic_jump` falsifies that rule: it depends on every `lang_*` and so on
# `similarity`, and §14 lists it MIT. `measure_rust` is that case exactly —
# four lines of `main`, whose artifact is GPL.
license = "MIT"

[lints]
workspace = true

# `core.md` §9: cargo names a binary target after the package verbatim, so the
# artifact this crate exists to produce needs the rename — the same one
# `heuristic_jump` needs (CHANGE-conformance-001).
[[bin]]
name = "measure-rust"
path = "src/measure_rust.rs"

# The only crate that depends on both `measure_core` and a language, and it
# contains four lines. A `[[bin]]` inside `lang_rust` would share that crate's
# dependency list, so `lang_rust` would acquire `measure_core` and
# `heuristic_jump` would then link an LSP client into the shipped binary. The
# dependency has to point this way, which means a separate crate.
#
# What it buys: **a language can be measured without any other language
# building** (`core.md` §7).
[dependencies]
clap.workspace = true
lang_rust.workspace = true
measure_core.workspace = true
shared.workspace = true
