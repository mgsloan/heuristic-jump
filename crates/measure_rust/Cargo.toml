[package]
name = "measure_rust"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

# MIT, like `heuristic_jump` and for the identical reason: `deps.md` §14 lists
# that crate as "MIT -- binary crate; the artifact it builds is GPL", and it
# depends on every `lang_*` and so on `similarity` too. So the field describes
# copyright in this crate's own four lines, not the licence of what they link,
# and §5 marks exactly `similarity` and `lang_*` GPL.
#
# This previously read GPL-3.0-or-later, reasoning "GPL through `lang_rust`" —
# a dependency rule `heuristic_jump` falsifies. `deps.md` §5's prose reaches
# the same MIT conclusion by a reason that is false ("none of them depends on
# `similarity`"), which is why the conclusion is escalated rather than assumed.
# DECISION-conformance-014: provisional
license = "MIT"

[lints]
workspace = true

# `core.md` §9: cargo names a binary target after the package verbatim, so the
# artifact this crate exists to produce needs the rename — the same one
# `heuristic_jump` needs (CHANGE-conformance-001).
[[bin]]
name = "measure-rust"
path = "src/measure_rust.rs"

# The only crate that depends on both `measure_core` and a language, and it
# contains four lines. A `[[bin]]` inside `lang_rust` would share that crate's
# dependency list, so `lang_rust` would acquire `measure_core` and
# `heuristic_jump` would then link an LSP client into the shipped binary. The
# dependency has to point this way, which means a separate crate.
#
# What it buys: **a language can be measured without any other language
# building** (`core.md` §7).
[dependencies]
clap.workspace = true
lang_rust.workspace = true
measure_core.workspace = true
shared.workspace = true
