[workspace]
resolver = "3"
members = [
  "crates/driver",
  "crates/heuristic_jump",
  "crates/lang_rust",
  "crates/measure_core",
  "crates/measure_rust",
  "crates/shared",
  "crates/similarity",
  "vendor/rope",
  "vendor/sum_tree",
]

[workspace.package]
edition = "2024"
publish = false
# `conformance-002` (answered): a human placed `rust-toolchain.toml`, and the
# two are not a duplicate. That file *selects* a toolchain; this is a floor —
# an older rustc is refused, a newer one is not — and cargo enforces it per
# package, which `rust-toolchain.toml` does not. They are both true only while
# they agree, which `the_workspace_manifest_has_the_shape_section_14_states`
# in `crates/driver/tests/seam.rs` is what checks.
rust-version = "1.95.0"

# Every version lives here and members write `foo.workspace = true`, so the
# vendored Zed crates and ours cannot resolve two copies of the same
# dependency (`deps.md` section 14). `license` is deliberately not here: ours
# is MIT and the vendored crates keep what they arrived with (`deps.md` §5).
[workspace.dependencies]
driver = { path = "crates/driver" }
lang_rust = { path = "crates/lang_rust" }
measure_core = { path = "crates/measure_core" }
shared = { path = "crates/shared" }
similarity = { path = "crates/similarity" }
rope = { path = "vendor/rope" }
sum_tree = { path = "vendor/sum_tree" }

# Ours, chosen in `deps.md` §0's table and argued in the section each names.
# Each arrives with its first user rather than up front, so a pin here is
# always one somebody has resolved and built against (`deps.md` §14).
#
# `tree-sitter`'s *runtime* version is ours to pick and tracks a recent release
# — it is the grammars that are pinned to Zed's revisions, and no grammar crate
# is in the graph yet (`deps.md` §6).
# `default-features = false` is the whole reason the crate count is bearable:
# it drops the six-crate `anstream`/`colorchoice` terminal-colour stack, which
# a process that talks JSON-RPC over stdio has no use for (`deps.md` §11).
# Ported with `similarity` from the prior implementation (`resolution.md` §5).
# The occurrence machinery is written against these four, and rewriting it
# around `Vec` would make the port a rewrite of the one piece the design calls
# "genuinely hard to rewrite well". `hashbrown`'s raw `HashTable` is what lets
# an occurrence multiset be probed by a `u32` hash without rehashing;
# `smallvec`'s `const_generics` is what `SmallOccurrences<N, S>` is; and
# `arraydeque`'s wrapping deque is the n-gram window.
arraydeque = "0.5.1"
hashbrown = "0.16.1"
itertools = "0.14.0"
smallvec = { version = "1.15.1", features = ["const_generics"] }

clap = { version = "4.5", default-features = false, features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
ignore = "0.4.31"
# `deps.md` §8's parse cache, with the caveat the section states: `shim.md` §5
# wants the cache bounded by *both* entry count and total bytes, and `lru`
# bounds only entries — so `driver` wraps it, tracking a running byte total and
# calling `pop_lru` until under the ceiling. `schnellru` supports custom
# limiters and would need no wrapper; §8 declines it on maturity grounds and
# says the choice is worth revisiting if the wrapper gets awkward.
lru = "0.16"
# `deps.md` §7's watcher, deferred: `core.md` §4 gives the file list two
# invalidation paths that do not need it, and in proxy mode the editor is
# already watching — its `workspace/didChangeWatchedFiles` notifications cross
# the shim, so a `notify` watcher would be a second, worse copy of a signal
# already on the wire. Declared anyway, behind `driver`'s non-default `watch`
# feature, because §7 asks for the decision to be visible rather than lost.
notify = "8"
# `deps.md` §0's table and §1: chosen over tokio, and over `std::sync::mpsc`
# because `core`'s loop needs `select!` over several receivers and std has
# none. Arrives with its first user, which is `core.md` §4's background rescan.
crossbeam-channel = "0.5"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
# `raw_value` is not optional: `deps.md` §4 forwards frames without
# materializing them, which is what `RawValue` is for. It is declared here
# rather than at the first user because a feature added later unifies across
# the whole graph anyway, and a `serde_json` without it silently compiles.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2.0"
# `servers.toml` names the oracle every language is scored against, and it is
# written by a human in whatever valid TOML reads best — `[server.<name>]`
# tables today, and it will keep diverging from whatever subset a hand-reader
# accepts. Its failure mode is refusing a valid file at minute zero of a
# hundred-hour collection run, which is what `state/decisions/conformance-010.md`
# weighed the crates against. `default-features = false` drops the serializing
# half: nothing here writes TOML, and `toml_write` leaves the graph with it.
# What it does cost, measured rather than predicted: `toml`, `toml_datetime`,
# `toml_parser`, `winnow` and `serde_spanned` — five, where the ruling weighed
# four, because the parser is the half that keeps `winnow`.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# `deps.md` §9: `env-filter` is what `--log` is a string for, and `fmt` is a
# default feature. The subscriber is installed in `heuristic_jump` and nowhere
# else — `driver` and `shared` emit through the `tracing` facade and have no
# opinion about where it goes.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
# The *grammar*, and the one dependency here that is not ours to pick:
# `high-level.md` requires the grammars to match Zed's, so this is
# `../zed/Cargo.toml`'s value and moves only when Zed's does (`deps.md` §6).
# The runtime above is a separate question and tracks a recent release; the two
# meet through `tree-sitter-language`'s ABI rather than through a version
# constraint, which is what lets them differ.
tree-sitter-rust = "0.24.2"
url = "2.5"

# Held at `../zed/Cargo.toml`'s values at `90d024b8`, because the vendored
# crates are written against them and `deps.md` §5 records each as forced by
# rope rather than chosen. Two deliberate differences from Zed:
#
# * `log` drops Zed's `kv_unstable_serde`/`serde` features. Nothing in rope or
#   sum_tree uses structured logging — they call `log::error!`/`log::info!` —
#   and the features exist for Zed crates we did not take.
# * `proptest` is crates.io's rather than Zed's git rev. The rev is there for
#   the `attr-macro` feature, which `sum_tree`'s `property_test.rs` does not
#   use, and `deps.md` §12 wants proptest for our own property tests anyway.
heapless = "0.9.2"
log = "0.4"
rayon = "1.8"
tracing = "0.1.40"
unicode-segmentation = "1.10"

# `rand` is pinned to 0.9 rather than crates.io's current major on purpose:
# upstream's tests are kept verbatim and are written against
# `rng.random_range(..)`. Taking 0.10 would mean editing test bodies, which
# defeats keeping them (`deps.md` §12, `rope-modifications.md` §7).
rand = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

# The differential oracle for `shared::proto` (`deps.md` §3 and §12,
# `core.md` §8.5 and §10). **Dev-only, and that is not a preference**: §3's
# whole argument is that the newtype must be what deserialization produces, and
# a single runtime `use lsp_types::` defeats it. `driver`'s seam test asserts
# the distinction against the manifests rather than trusting it.
#
# Held at 0.94 deliberately. 0.95 swapped `url::Url` for `fluent-uri`, and the
# point of the oracle is that it produces the same `Url` we do — an oracle
# whose URIs are a different type compares nothing where percent-encoding and
# drive letters live, which is where the bugs actually are.
lsp-types = "0.94"

[workspace.lints.rust]
# Edition 2024 made `env::set_var` and friends unsafe; be explicit about scope.
unsafe_op_in_unsafe_fn = "deny"
# `let _ = handle;` silently drops a JoinHandle or a guard. In a design that is
# ~5 long-lived threads plus RAII guards, that is a real bug class.
let_underscore_drop = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]

# -- group levels -----------------------------------------------------------
# Follow Zed: style nits slow down shipping and are discovered late. Individual
# lints below sit at the default priority 0 and so override this.
#
# CAUTION: `disallowed_methods`, `disallowed_types`, `disallowed_macros`,
# `disallowed_names` and `disallowed_fields` are all in the STYLE group. The
# first three are re-denied by name below. `disallowed_fields` (new in 1.95) is
# NOT, so it is currently off — deny it here by name if you ever reach for it.
style = { level = "allow", priority = -1 }

# -- path-based bans; the paths themselves are in ./clippy.toml -------------
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

# -- stdout is the JSON-RPC wire -------------------------------------------
# A stray write corrupts the protocol stream. Note print_stdout/print_stderr
# catch only the print!/println!/eprint!/eprintln! macro family — direct writes
# to std::io::stdout() are banned in clippy.toml instead.
print_stdout = "deny"
print_stderr = "deny"
explicit_write = "deny"              # catches write!(std::io::stdout(), ..)
dbg_macro = "deny"

# -- panic discipline -------------------------------------------------------
# A panic in a long-lived pipe thread kills the shim and takes the editor's
# language support with it. All five honour their allow-*-in-tests config keys
# in clippy.toml where one exists.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"                        # a stray process::exit is the same failure
panic_in_result_fn = "deny"          # reinforces deps.md §10: Result is not the abstain path

# -- position encoding (core.md §3: highest-risk correctness detail) --------
# The wire carries u32; offsets internally are usize; the unit (UTF-16 code
# units vs UTF-8 bytes) depends on a negotiation. Every place those meet is an
# `as` cast. WirePosition's private fields stop you STORING the wrong thing;
# these stop you COMPUTING it.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
char_lit_as_u8 = "deny"

# NOT denied: `indexing_slicing` and `string_slice`. The bounded prefix scanner
# (shim.md §3.1) and most of the rope work are nothing but indexing and
# slicing; under a deny those files become a wall of #[expect], which turns a
# lint into decoration in the one place it would have mattered most. The
# protection that holds here is structural: WirePosition has private fields,
# offsets are newtypes, and the cast_* denies above still catch the arithmetic.

# -- determinism ------------------------------------------------------------
# Hash iteration order varies between executions of the same program on the
# same hardware. This project is a measurement harness with insta snapshots,
# JSONL corpus records and candidate ranking; an FxHashMap in a for loop
# silently makes all three irreproducible. Catches .keys()/.values()/.iter() too.
iter_over_hash_type = "deny"

# -- closed error set (deps.md §10) -----------------------------------------
# The top-level `Error` is deliberately NOT #[non_exhaustive], so an exhaustive
# match is a feature. A single `_ =>` arm gives that away, and shim.md §11's
# failure table is only enforceable if the compiler catches new variants.
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
# `Error` nests nine sub-enums carrying PathBuf/DocumentUri/Offset, and sits
# in the Err of every Result on the hot path. Threshold tuned in clippy.toml.
result_large_err = "deny"
large_enum_variant = "deny"

# -- time -------------------------------------------------------------------
# Instant - Duration and Duration - Duration underflow and panic.
unchecked_time_subtraction = "deny"

# -- numeric ----------------------------------------------------------------
# p50/p99 and per-stratum percentages: silent truncation produces
# plausible-looking wrong numbers, which is the worst failure for a metric.
integer_division = "deny"
float_cmp = "deny"

# -- clone cost (core.md §2: the design turns on Rope/Tree clones being cheap)
# Forces Arc::clone(&x) over x.clone(), so "is this the cheap kind?" is visible
# at the call site rather than requiring you to know the type.
clone_on_ref_ptr = "deny"
# NOTE: `redundant_clone` is a NURSERY lint — it was moved out of `perf` after
# upstream MIR changes produced a batch of false positives, and its own docs
# call the analysis conservative and limited. Kept because it is the lint that
# would catch a Rope/Tree clone that is not cheap, but at `warn`, so a false
# positive does not break the build under -D warnings.
redundant_clone = "warn"

# -- unsafe -----------------------------------------------------------------
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
mem_forget = "deny"

# -- attribute hygiene ------------------------------------------------------
# These mechanize "each allow carries a comment saying why": the first pushes
# #[allow] -> #[expect], so a silenced lint that stops being necessary becomes
# a warning instead of accumulating; the second requires reason = "...".
# Neither can be `forbid`: macro-generated code sometimes forces a plain
# #[allow]. Known FP: a lint that only fires in test builds confuses the
# allow->expect suggestion (rust-clippy#16488).
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# -- misc -------------------------------------------------------------------
declare_interior_mutable_const = "deny"

# Zed's values, and the right ones for a binary whose headline metric is
# latency but which still needs usable backtraces from user reports
# (`deps.md` §14).
[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

# `deps.md` §14, "we take exactly those": the crates that dominate debug
# runtime, in Zed's inline form and no wider than Zed's list. Parsing in a
# debug build is otherwise slow enough to distort every latency observation
# made while developing, which for this project would mean tuning against a
# fiction (§6).
#
# The proc-macro three are the ones inside Zed's `# proc-macros start/end`
# block that are not Zed's own crates; the other seven there are `gpui_macros`
# and friends and have nothing to do with us. They are here because every
# derive in the workspace — `serde`, `thiserror`, `clap` — is compiled through
# them, so an unoptimised `syn` is paid once per dependent crate on a cold
# build.
#
# Held by `every_package_section_14_names_gets_its_opt_level` in
# `crates/driver/tests/seam.rs`, which checks both directions and that each
# package is really in the graph. Cargo does *not* reject an override naming a
# package that is not — it prints "did not match any packages" and carries on,
# so a bump for a crate that was renamed or dropped goes on looking applied.
[profile.dev.package]
tree-sitter = { opt-level = 3 }
serde_json = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
