# Phase 1b's decision: which repositories the corpus is made of.
# `design/data-collection.md` section 1.
#
# This file is the human half of repository selection. The machine half is
# `harness/corpus-lock.toml` beside it, which `harness/corpus clone` writes:
# one pinned SHA per repository plus what it measured when it was pinned.
#
# The two together are the whole corpus. Everything under the corpus root --
# the checkouts and the generated `manifest.toml` files -- rebuilds from them,
# so the corpus directory is derived output rather than something that has to
# survive. What it cannot rebuild is a commit that upstream has destroyed.
#
# Three properties of the selection are load-bearing, and all three are
# expensive or impossible to fix later:
#
# * **The split is decided here and never revisited.** Once a repository has
#   been in the tuning corpus, moving it to held-out does not un-teach it
#   (`design/loops.md` section 12). Editing a `split` on an existing entry is
#   therefore not a correction, it is corpus damage.
#
# * **A repository is never bumped.** A newer commit is a different corpus. If
#   one must be replaced, `retired = true` goes on the old entry and the new
#   one is *added*; the manifest grows rather than changes
#   (`design/data-collection.md` section 1).
#
# * **`[[considered]]` is not decoration.** It is what makes selection bias
#   auditable when a metric later looks suspiciously good and the question is
#   whether the corpus earned it. Every candidate that was looked at and
#   passed over is here with the reason, including the ones rejected for
#   nothing more interesting than size.
#
# Line counts in `[[considered]]` are estimates from the GitHub API --
# primary-language bytes over an average bytes-per-line -- taken on
# 2026-08-02 during selection. They are what the reject decisions were made
# against, and they are deliberately *not* refreshed: the estimate is the
# evidence for a decision that was already made. Selected repositories carry
# a measured count in the manifest instead.
#
# Dependency resolution is **not** established here. Phase 1b is clone and
# pin only; `design/data-collection.md` section 1 wants full resolution
# verified by LSP probe, and there are no servers until phase 1c. Phase 1c
# writes what each repository needed into a `dependencies` field on its
# `[[repo]]` entry here, rather than into the generated manifest, so that it
# survives the corpus being rebuilt.

corpus_root = "../heuristic-jump-corpus"

# Languages, named by their LSP `languageId` so the corpus directory and
# `shared::vocabulary::LanguageId` agree. TSX is not a separate directory --
# `design/data-collection.md` treats TypeScript/TSX as one language and the
# `.tsx` files live inside the typescript repositories.
languages = ["c", "cpp", "go", "javascript", "python", "rust", "typescript"]

# Selection criteria, recorded so the manifest states what the repositories
# were chosen *for* rather than only what was chosen.
[criteria]
size_lines = [20000, 200000]
size_reason = "below 20k a whole-project search finishes instantly and the latency budgets are never exercised; above 200k server indexing dominates collection"
popular = "actively maintained, real production code -- not tutorials, benchmark suites, or one-person experiments"
varied = "different organisations, a mix of applications and libraries, different domains"
handwritten = "not dominated by generated bindings"
split = "five tuning, five held out, per language, assigned at selection time"

